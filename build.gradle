plugins {
  id 'net.fabricmc.fabric-loom' version "${loom_version}"
  id 'maven-publish'
  // Change from 'com.github.johnrengelman.shadow' to 'com.gradleup.shadow'
  // Update version to 8.3.0+ (9.4.1 is the latest as of 2026)
  id 'com.gradleup.shadow' version '9.4.1'
}

version = project.mod_version
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

repositories {
  // Add repositories to retrieve artifacts from in here.
  // You should only use this when depending on other mods because
  // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
  // See https://docs.gradle.org/current/userguide/declaring_repositories.html
  // for more information about repositories.

  mavenCentral()
  maven { url "https://jitpack.io" }
  maven { url = 'https://maven.maxhenkel.de/repository/public' }
  maven { url = "https://maven.lavalink.dev/releases" }

  maven {
    name = "Modrinth"
    url = "https://api.modrinth.com/maven"
    content {
      includeGroup "maven.modrinth"
    }
  }
}

dependencies {
  // To change the versions see the gradle.properties file
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  implementation "net.fabricmc:fabric-loader:${project.loader_version}"

  // Fabric API. This is technically optional, but you probably want it anyway.
  implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

  // simple voice chat
  implementation "de.maxhenkel.voicechat:voicechat-api:2.6.13"
  runtimeOnly "maven.modrinth:simple-voice-chat:fabric-2.6.17+26.1.2"

  // lavaplayer
  implementation 'dev.arbjerg:lavaplayer:2.2.6'
  implementation 'dev.lavalink.youtube:v2:1.18.0'

  // Apache HttpClient dependency
  implementation 'org.apache.httpcomponents:httpclient:4.5.14'

  // Additional dependencies
  include 'org.jsoup:jsoup:1.22.2'
  include 'net.iharder:base64:2.3.9'
}

configurations {
  shadowImplementation {
    extendsFrom implementation
  }
}

processResources {
  inputs.property "version", project.version

  filesMatching("fabric.mod.json") {
    expand "version": project.version
  }
}

tasks.withType(JavaCompile).configureEach {
  it.options.release = 17
}

java {
  // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
  // if it is present.
  // If you remove this line, sources will not be generated.
  withSourcesJar()

  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

jar {
  // This line fixes the error
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  dependsOn shadowJar
  archiveClassifier.set("")

  from("LICENSE") {
    rename { "${it}_${project.base.archivesName.get()}" }
  }

  from {
    zipTree(shadowJar.archiveFile.get().asFile)
  }
}

// Configure the shadow plugin to include and relocate dependencies
shadowJar {
  configurations = [project.configurations.shadowImplementation]
  archiveClassifier = 'shadow-dev'
  relocate 'org.apache.http', 'dev.derock.svcmusic.apachehttp'
}

jar {
  dependsOn shadowJar

  archiveClassifier.set("")
  from {
    zipTree(shadowJar.archiveFile.get().asFile)
  }
}

// Configure the maven publication
publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
    }
  }

  // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
  repositories {
    // Add repositories to publish to here.
    // Notice: This block does NOT have the same function as the block in the top level.
    // The repositories here will be used for publishing your artifact, not for
    // retrieving dependencies.
  }
}
